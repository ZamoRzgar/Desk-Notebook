<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d573b"/>
      <stop offset="1" stop-color="#59391f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf8ee"/>
      <stop offset="1" stop-color="#f3ead3"/>
    </linearGradient>
  </defs>
  <!-- cover -->
  <rect x="56" y="40" width="400" height="432" rx="36" fill="url(#cover)"/>
  <rect x="56" y="40" width="400" height="432" rx="36" fill="none" stroke="#3d2812" stroke-opacity="0.35" stroke-width="6"/>
  <!-- pages -->
  <rect x="76" y="58" width="360" height="396" rx="18" fill="url(#paper)"/>
  <!-- spine -->
  <rect x="246" y="58" width="20" height="396" fill="#d9cbaa" opacity="0.55"/>
  <!-- ruled lines, left page -->
  <g stroke="#b9a682" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="104" y1="140" x2="220" y2="140"/>
    <line x1="104" y1="184" x2="220" y2="184"/>
    <line x1="104" y1="228" x2="220" y2="228"/>
    <line x1="104" y1="272" x2="220" y2="272"/>
  </g>
  <!-- ruled lines, right page -->
  <g stroke="#b9a682" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="292" y1="184" x2="408" y2="184"/>
    <line x1="292" y1="228" x2="408" y2="228"/>
    <line x1="292" y1="272" x2="408" y2="272"/>
  </g>
  <!-- highlighted line on right page -->
  <rect x="288" y="126" width="124" height="28" rx="8" fill="#fde68a"/>
  <!-- binder tabs -->
  <rect x="436" y="110" width="34" height="58" rx="10" fill="#f59e0b"/>
  <rect x="436" y="186" width="34" height="58" rx="10" fill="#0ea5e9"/>
  <rect x="436" y="262" width="34" height="58" rx="10" fill="#f43f5e"/>
</svg>
