<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desk Notebook</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='4' width='26' height='24' rx='3' fill='%236b4a32'/%3E%3Crect x='6' y='6' width='20' height='20' rx='1.5' fill='%23fdf8ee'/%3E%3Cpath d='M16 6v20' stroke='%23cbb48a' stroke-width='1'/%3E%3C/svg%3E"
    />
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('desk-notebook:theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
